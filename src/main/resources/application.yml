server:
  port: 8080

spring:
  application:
    name: sivitrix

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sivitrix}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway es quien manda en el esquema; Hibernate solo valida que coincida.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html


sivitrix:
  seguridad:
    habilitada: ${SEGURIDAD_HABILITADA:true}
    admin-usuario: ${ADMIN_USUARIO:admin}
    admin-clave: ${ADMIN_CLAVE:admin123}
    vendedor-usuario: ${VENDEDOR_USUARIO:vendedor}
    vendedor-clave: ${VENDEDOR_CLAVE:vendedor123}