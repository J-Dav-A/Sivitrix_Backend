server:
  port: 8080

spring:
  application:
    name: sivitrix

  datasource:
    url: jdbc:postgresql://localhost:5432/sivitrix
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway es quien manda en el esquema; Hibernate solo valida que coincida.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
